<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Meunier Signature</title>
    <style>
        :root {
            --bg: #080807;
            --panel: #11110f;
            --or: #cba35b;
            --gold2: #f0d49a;
            --cream: #f4efe5;
            --muted: #bcb6aa;
            --line: rgba(203, 163, 91, .35);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--cream); font-family: sans-serif; }
        header { position: sticky; top: 0; z-index: 5; background: #080807f2; border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); height: 42px; }
        .navigation-enveloppante { max-width: 1200px; margin: 0 auto; padding: 6px 20px; }
        @media (max-width: 850px) { .links { gap: 12px; } }
    </style>
</head>
<body>

    <header>
        <div class="navigation-enveloppante">
            <a class="marque" href="index.html" style="text-decoration: none;">
                <span style="color: var(--or); font-weight: bold; font-size: 18px;">MEUNIER SIGNATURE</span>
            </a>
        </div>
    </header>

    <section>
        <div class="envelopper" style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
            <div class="tete" style="text-align: center; margin-bottom: 40px;">
                <div class="sourcil" style="color: var(--or); text-transform: uppercase; letter-spacing: 2px; font-size: 14px; font-weight: bold;">Demandez un devis gratuit</div>
                <h2 style="font-size: 32px; color: var(--cream); margin: 10px 0;">Contact</h2>
                <p style="color: var(--muted); line-height: 1.6;">Une idée ? Un projet de rénovation, de carrelage ou de placo/isolation en Charente ?</p>
            </div>

            <!-- Formulaire de contact opérationnel -->
            <form action="https://formspree.io" method="POST" style="display: flex; flex-direction: column; gap: 20px; background: var(--panel); padding: 30px; border-radius: 8px; border: 1px solid var(--line);">
                
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="color: var(--cream); font-size: 14px;">Nom & Prénom</label>
                    <input type="text" name="name" required style="background: var(--bg); border: 1px solid var(--line); padding: 12px; color: var(--cream); border-radius: 4px;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="color: var(--cream); font-size: 14px;">Adresse e-mail</label>
                    <input type="email" name="email" required style="background: var(--bg); border: 1px solid var(--line); padding: 12px; color: var(--cream); border-radius: 4px;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="color: var(--cream); font-size: 14px;">Téléphone</label>
                    <input type="tel" name="phone" style="background: var(--bg); border: 1px solid var(--line); padding: 12px; color: var(--cream); border-radius: 4px;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="color: var(--cream); font-size: 14px;">Votre projet (rénovation, carrelage, etc.)</label>
                    <textarea name="message" rows="5" required style="background: var(--bg); border: 1px solid var(--line); padding: 12px; color: var(--cream); border-radius: 4px; resize: vertical;"></textarea>
                </div>

                <button type="submit" style="background: var(--or); color: var(--bg); border: none; padding: 14px; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 4px;">
                    Envoyer ma demande
                </button>

            </form>
        </div>
    </section>
</body></html>
