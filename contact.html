<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Meunier Signature</title>
    <style>
        :root {
            --bg: #080807;
            --panel: #11110f;
            --or: #cba35b;
            --gold2: #f0d49a;
            --cream: #f4efe5;
            --muted: #bcb6aa;
            --line: rgba(203, 163, 91, .35);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--cream); font-family: sans-serif; }
        header { position: sticky; top: 0; z-index: 5; background: #080807f2; border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); height: 42px; }
        .navigation-enveloppante { max-width: 1200px; margin: 0 auto; padding: 6px 20px; }
        @media (max-width: 850px) { .links { gap: 12px; } }
    </style>
</head>
<body>

    <header>
        <div class="navigation-enveloppante">
            <a class="marque" href="index.html" style="text-decoration: none;">
                <span style="color: var(--or); font-weight: bold; font-size: 18px;">MEUNIER SIGNATURE</span>
            </a>
        </div>
    </header>

    <section>
        <div class="envelopper" style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
            <div class="tete" style="text-align: center; margin-bottom: 40px;">
                <div class="sourcil" style="color: var(--or); text-transform: uppercase; letter-spacing: 2px; font-size: 14px; font-weight: bold;">Demandez un devis gratuit</div>
                <h2 style="font-size: 32px; color: var(--cream); margin: 10px 0;">Contact</h2>
                <p style="color: var(--muted); line-height: 1.6;">Une idée ? Un projet de rénovation, de carrelage ou de placo/isolation en Charente ?</p>
            </div>
         <!-- Bannières de statut invisibles par défaut (gérées automatiquement par la bibliothèque Formspree) -->
<div data-fs-success style="margin-bottom: 20px;"></div>
<div data-fs-error style="margin-bottom: 20px;"></div>

<!-- Le formulaire possède désormais un ID unique indispensable pour le script -->
<form id="meunier-contact-form" style="display:flex; flex-direction:column; gap:20px; background:var(--panel); padding:20px;">
    
    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Nom & Prénom</label>
        <input type="text" name="name" required data-fs-field style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);">
        <span data-fs-error="name"></span>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Adresse e-mail</label>
        <input type="email" name="email" required data-fs-field style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);">
        <span data-fs-error="email"></span>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Téléphone</label>
        <input type="tel" name="phone" data-fs-field style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);">
        <span data-fs-error="phone"></span>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Votre projet (rénovation, carrelage, etc.)</label>
        <textarea name="message" rows="5" required data-fs-field style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);"></textarea>
        <span data-fs-error="message"></span>
    </div>

    <!-- Le bouton se désactivera tout seul pendant l'envoi pour éviter les doubles clics -->
    <button type="submit" data-fs-submit-btn style="background:var(--gold); color:var(--bg); border:none; padding:14px; font-weight:bold; font-size:16px; cursor:pointer;">
        Envoyer ma demande
    </button>

</form>

<!-- Script officiel Formspree AJAX pour l'envoi sur site statique -->
<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { formElement: '#meunier-contact-form', formId: 'xbgdplgg' });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>

</body>
</html>

            </form>
        </div>
    </section>
</body></html>
