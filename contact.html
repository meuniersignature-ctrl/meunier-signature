<section><div class="wrap" style="max-width:600px; margin:0 auto; padding:40px 20px;">
<div class="head" style="text-align:center; margin-bottom:40px;">
<div class="eyebrow" style="color:var(--gold); text-transform:uppercase; letter-spacing:2px; font-size:14px; font-weight:bold;">Contact</div>
<h2 style="font-size:32px; color:var(--cream); margin:10px 0;">Demandez un devis gratuit</h2>
<p style="color:var(--muted); line-height:1.6;">Une idée ? Un projet de rénovation, de carrelage ou placo/isolation en Charente ? Remplissez ce formulaire ou contactez-nous directement.</p>
</div>

<!-- Formulaire de contact -->
<form action="https://formspree.io" method="POST" style="display:flex; flex-direction:column; gap:20px; background:var(--panel); padding:20px;">
    
    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Nom & Prénom</label>
        <input type="text" name="name" required style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);">
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Adresse e-mail</label>
        <input type="email" name="email" required style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);">
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Téléphone</label>
        <input type="tel" name="phone" style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);">
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="color:var(--cream); font-size:14px;">Votre projet (rénovation, carrelage, etc.)</label>
        <textarea name="message" rows="5" required style="background:var(--bg); border:1px solid var(--line); padding:12px; color:var(--cream);"></textarea>
    </div>

    <button type="submit" style="background:var(--gold); color:var(--bg); border:none; padding:14px; font-weight:bold; font-size:16px; cursor:pointer;">
        Envoyer ma demande
    </button>

</form>


</body></html>
